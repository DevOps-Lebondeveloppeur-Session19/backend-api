name: CI/CD backend-api

on:
  push:
    branches: [ "main" ]


env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/backend-api:${{ github.run_number }}


jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name : build docker image
      run: docker build -t ${{ env.IMAGE_NAME }} .

    - name: Login to Docker Hub
      uses: docker/login-action@v3 
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push Docker image 
      run: docker push ${{ env.IMAGE_NAME }}


  deploy-job:

    runs-on: ubuntu-latest

    needs: build-and-push  

    steps:

      - name: Connect to the VPS using SSH
        uses: appleboy/ssh-action@master # master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |

              # Pull the latest Docker image
              sudo docker pull ${{ env.IMAGE_NAME }}
              
              # Remove the old container if it exists
              sudo docker rm -f backend-api 

              sudo docker run -d \
              -p 3001:3001 \
              --name backend-api \
              --network backend-api-net \
              -e MONGO_URI=mongodb://root:pass-123@mongodb:27017/book-store?authSource=admin \
              --restart always \
              ${{ env.IMAGE_NAME }}


              # Shows running containersss
              sudo docker ps

